<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>推し部屋 v2</title><link rel="stylesheet" href="style.css"></head><body>
<div id="sparkles"></div><main><header><div><small>MY OSHI ROOM</small><h1>推し部屋</h1><div class="level">Lv.<b id="lv">1</b> ♡ <span id="xp">0</span>/<span id="need">50</span></div></div><div class="coin">🪙 <b id="coins">100</b></div></header>
<section class="room" id="room"><div class="window"><span>☁️</span><b>✨</b></div><div id="placed"></div><div class="rug"></div><div class="floorGlow"></div></section>
<section class="daily card"><div><b>🎁 今日のごほうび</b><p id="dailyText">毎日開くとボーナスコイン</p></div><button id="daily">受け取る</button></section>
<section class="card"><h2>💗 10秒ハートキャッチ</h2><p>ハートをたくさんタップして、推し部屋コインを集めよう。</p><div class="game"><button id="heart">♡</button><div><strong id="score">0</strong> pt<br><span id="timer">10秒</span></div></div><button class="primary" id="start">ゲームスタート</button></section>
<section class="card"><h2>🎨 推しカラー</h2><div class="colors" id="colors"></div></section>
<section class="card"><h2>🛍️ インテリア</h2><p>集めた家具はすぐお部屋に飾られるよ。</p><div id="shop" class="shop"></div></section>
<section class="card collection"><h2>✨ コレクション</h2><div><b id="ownedCount">0</b> / <b id="totalCount">0</b> アイテム</div><div class="bar"><i id="progress"></i></div></section>
<p class="note">ログイン・外部APIなし / 端末内に自動保存</p></main><script src="app.js"></script></body></html>
